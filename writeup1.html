<h2>题目信息</h2>
<p>题目：滑稽，类型：Web，分数：10分</p >
<p>现象：进入场景后有散射的滑稽表情，鼠标右键消失。</p >

<h2>解题思路</h2>
<p>1.页面看不到内容接看源代码</p >
<p>2.网页禁止鼠标右键，因此使用快捷键 Ctrl+U 打开网页源代码。</p >
<p>3.使用Ctrl+F搜索flag，在HTML注释标签 `<!-- -->` 内找到隐藏flag。</p >
